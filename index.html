<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة الطباعة ونقاط الزبائن — مكتبة عمر سوفت</title>
<meta name="theme-color" content="#0D4777"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;height:100%;background:#0D4777}
.ld{font:18px Tahoma,Arial,sans-serif;color:#fff;padding:60px 24px;text-align:center;line-height:1.8}</style>
</head><body>
<div class="ld" id="ld">جاري تحميل البرنامج…</div>
<!-- هذه الصفحة لا تتغير: تجلب البرنامج من Apps Script (ملف index) وتعرضه مباشرة. كل التحديثات تكون في Apps Script فقط. -->
<script>
(function(){
  var KEY='appHtmlCache1';
  function say(m){var d=document.getElementById('ld');if(d)d.innerHTML=m;}
  try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});});if(window.caches)caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});});}catch(e){}
  var seg='/'+(location.pathname.split('/')[1]||'')+'/';
  var tries=['config.js','../config.js',seg+'config.js'];
  var FALLBACK='https://script.google.com/macros/s/AKfycbzhjlDMsgywVJFZ1dfLWmTpUa9UMjv8dNnXy6SlS_m0ZjqRLfl7dsRnKh85smbinGfNqw/exec'; // احتياط إذا تعذّر قراءة config.js
  function cfg(){
    var u=String(window.API_URL||'').trim();
    if(/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return go(u);
    var s=tries.shift();if(!s)return go(FALLBACK);
    var e=document.createElement('script');e.src=s+'?v='+Date.now();e.onload=e.onerror=cfg;document.head.appendChild(e);
  }
  // بديل google.script.run: نفس البرنامج يرسل طلباته إلى Apps Script عبر الإنترنت مباشرة
  function shim(u){
    return '<script>window.API_URL='+JSON.stringify(u)+';window.google={script:{run:(function(){function R(s,f){this.s=s;this.f=f}'+
      'R.prototype.withSuccessHandler=function(h){return new R(h,this.f)};R.prototype.withFailureHandler=function(h){return new R(this.s,h)};'+
      'R.prototype.api=function(req){var s=this.s,f=this.f;fetch(window.API_URL,{method:"POST",body:JSON.stringify(req),redirect:"follow"})'+
      '.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){if(s)s(j)},function(e){if(f)f(e)})};return new R()})()}};<\/script>'+
      '<link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">';
  }
  function show(u,html){
    html=html.replace(/<head[^>]*>/i,function(m){return m+shim(u);});
    document.open();document.write(html);document.close();
  }
  function go(u){
    var cached='';try{cached=localStorage.getItem(KEY)||'';}catch(x){}
    var shown=false;
    // يفتح فوراً من آخر نسخة محفوظة، ويجلب النسخة الجديدة في الخلفية (تظهر في المرة القادمة)
    if(cached){shown=true;setTimeout(function(){show(u,cached);},0);}
    var t0=Date.now(),slow=setInterval(function(){
      if(shown)return;var s=Math.round((Date.now()-t0)/1000);
      say('جاري تحميل البرنامج… ('+s+' ث)'+(s>=8?'<br><small>أول فتح بعد كل تحديث قد يأخذ حتى 30 ثانية.</small>':''));
    },1000);
    var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort();},70000);
    fetch(u,{method:'POST',body:JSON.stringify({action:'appHtml'}),redirect:'follow',signal:ctl?ctl.signal:undefined})
      .then(function(r){return r.text().then(function(t){try{return JSON.parse(t);}catch(e){throw new Error('ردّ Google ليس بالشكل المنتظر (HTTP '+r.status+'): '+t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,160));}});})
      .then(function(j){
        if(!j||!j.ok||!j.html){
          var m=(j&&j.err)||'';
          throw new Error(/عملية غير معروفة|قديمة|حدّثوا/.test(m)||!m?'Code.gs المنشور في Apps Script ليس آخر نسخة: الصقوا Code.gs الأخير ثم Deploy ← Manage deployments ← ✏️ ← New version ← Deploy.':m);
        }
        try{localStorage.setItem(KEY,j.html);}catch(e){}
        if(!shown){shown=true;show(u,j.html);}
      })
      .catch(function(e){
        if(shown)return;
        var m=e&&e.name==='AbortError'?'انتهى وقت الانتظار (70 ثانية) بدون رد من Google.':(e&&e.message||'');
        if(/Failed to fetch|NetworkError|Load failed|network/i.test(m))m='تعذّر الاتصال بـ Google ('+m+'). تحقق من الإنترنت.';
        say('⚠️ '+m.replace(/[<>]/g,'')+'<br><br><a style="color:#FFD08A" href="">إعادة المحاولة</a>');
      })
      .then(function(){clearInterval(slow);clearTimeout(to);});
  }
  cfg();
})();
</script>
</body></html>
