<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة عمر سوفت</title>
<meta name="theme-color" content="#0D4777">
<style>html,body{margin:0;height:100%;background:#F4F6FA}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.err{font:18px Tahoma,Arial,sans-serif;color:#0D4777;padding:40px;text-align:center;line-height:1.8}</style>
</head><body>
<!-- ملف واحد يصلح للمكانين: في الأعلى = برنامج العمال، داخل مجلد z = صفحة الزبائن «نقاطي». البرنامج نفسه في Apps Script. -->
<script>
(function(){
  var cust=/\/z(\/|\/index\.html)?$/.test(location.pathname);
  document.title=cust?'نقاطي — مكتبة عمر سوفت':'حاسبة الطباعة ونقاط الزبائن — مكتبة عمر سوفت';
  var ic=document.createElement('link');ic.rel='icon';ic.href=(cust?'../':'')+'icon-192.png';document.head.appendChild(ic);
  if(!cust){var mf=document.createElement('link');mf.rel='manifest';mf.href='manifest.webmanifest';document.head.appendChild(mf);}
  // إزالة أي نسخة قديمة مخزّنة في المتصفح
  try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister();});});if(window.caches)caches.keys().then(function(k){k.forEach(function(n){caches.delete(n);});});}catch(e){}
  // config.js يُقرأ دائماً من المجلد الرئيسي وبنسخة جديدة
  var tries=cust?['../config.js','config.js']:['config.js','../config.js'];
  function next(){
    var u=String(window.API_URL||'').trim();
    if(/^https:\/\/script\.google\.com\/.+\/exec$/.test(u))return start(u);
    var src=tries.shift();
    if(!src){document.body.innerHTML='<div class="err">'+(cust?'الصفحة غير جاهزة بعد.':'لم يُضبط رابط البرنامج في ملف <b>config.js</b>.<br>ضعوا فيه رابط Apps Script الذي ينتهي بـ <b>/exec</b>.')+'</div>';return;}
    var s=document.createElement('script');s.src=src+'?v='+Date.now();s.onload=s.onerror=next;document.head.appendChild(s);
  }
  function start(u){
    var f=document.createElement('iframe');
    if(cust){var card=(location.search.match(/[?&](?:card|n)=(\d{1,6})/)||[])[1]||'';f.src=u+'?c=1'+(card?'&card='+card:'');f.title='نقاطي';}
    else{f.src=u;f.title='البرنامج';f.allow='clipboard-read; clipboard-write; fullscreen';f.addEventListener('load',function(){f.focus();});window.addEventListener('focus',function(){f.focus();});}
    document.body.appendChild(f);
  }
  next();
})();
</script>
</body></html>
