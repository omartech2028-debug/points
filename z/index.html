<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نقاطي — مكتبة عمر سوفت</title>
<link rel="icon" href="../icon-192.png"><meta name="theme-color" content="#0D4777">
<style>html,body{margin:0;height:100%;background:#F4F6FA}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
.err{font:18px Tahoma,Arial,sans-serif;color:#0D4777;padding:40px;text-align:center;line-height:1.8}</style>
<script src="../config.js"></script>
</head><body>
<!-- صفحة الزبائن «نقاطي»: تعرض صفحة الزبائن من Apps Script. لا تتغير أبداً. -->
<script>
(function(){
  var u=String(window.API_URL||'').trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){document.body.innerHTML='<div class="err">الصفحة غير جاهزة بعد.</div>';return;}
  var card=(location.search.match(/[?&](?:card|n)=(\d{1,6})/)||[])[1]||'';
  var f=document.createElement('iframe');f.title='نقاطي';
  f.src=u+'?c=1'+(card?'&card='+card:'');document.body.appendChild(f);
})();
</script>
</body></html>
